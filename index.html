<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo タスク管理アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Todo タスク管理</h1>
            <div class="header-buttons">
                <button id="importData" class="btn btn-secondary">📂 読込</button>
                <button id="exportData" class="btn btn-secondary">💾 保存</button>
                <button id="exportText" class="btn btn-secondary">📋 テキスト出力</button>
                <button id="addRootTask" class="btn btn-primary">+ 新規タスク</button>
            </div>
            <input type="file" id="fileInput" accept=".json" style="display: none;">
        </header>

        <main class="task-container">
            <div id="taskList" class="task-list"></div>
        </main>
    </div>

    <!-- タスク編集モーダル -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>タスク編集</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="taskTitle">タイトル <span class="hint">Enter: 保存 / Shift+Enter: 改行</span></label>
                    <textarea id="taskTitle" class="form-input task-title-input" placeholder="タスク名を入力" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label>帯の色</label>
                    <div class="color-picker">
                        <input type="color" id="bandColor" value="#3498db">
                        <button class="btn btn-small" id="clearBandColor">クリア</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>文字装飾</label>
                    <div class="text-style-buttons">
                        <button class="style-btn" data-style="bold" title="太字">B</button>
                        <button class="style-btn" data-style="italic" title="斜体">I</button>
                        <button class="style-btn" data-style="underline" title="下線">U</button>
                        <button class="style-btn" data-style="strikethrough" title="打消し線">S</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>文字色</label>
                    <div class="color-picker">
                        <input type="color" id="textColor" value="#333333">
                        <button class="btn btn-small" id="clearTextColor">クリア</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fontSize">文字サイズ</label>
                    <select id="fontSize" class="form-input">
                        <option value="small">小</option>
                        <option value="medium" selected>中</option>
                        <option value="large">大</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelEdit">キャンセル</button>
                <button class="btn btn-primary" id="saveTask">保存</button>
            </div>
        </div>
    </div>

    <!-- 確認ダイアログ -->
    <div id="confirmDialog" class="modal hidden">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>確認</h2>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">このタスクを削除しますか？</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="confirmCancel">キャンセル</button>
                <button class="btn btn-danger" id="confirmOk">削除</button>
            </div>
        </div>
    </div>

    <!-- メモポップアップ -->
    <div id="memoPopup" class="memo-popup hidden">
        <div class="memo-popup-header">
            <span>メモ</span>
            <button class="memo-popup-close" id="closeMemo">&times;</button>
        </div>
        <textarea id="memoText" class="memo-textarea" placeholder="メモを入力..."></textarea>
        <div class="memo-popup-footer">
            <button class="btn btn-small btn-primary" id="saveMemo">保存</button>
        </div>
    </div>

    <!-- テキスト出力モーダル -->
    <div id="textExportModal" class="modal hidden">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>テキスト出力</h2>
                <button class="modal-close" id="closeTextExport">&times;</button>
            </div>
            <div class="modal-body">
                <div class="export-format-tabs">
                    <button class="tab-btn active" data-format="markdown">マークダウン</button>
                    <button class="tab-btn" data-format="table">テーブル</button>
                    <button class="tab-btn" data-format="plain">プレーン</button>
                </div>
                <textarea id="textExportContent" class="export-textarea" readonly></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="copyTextExport">📋 コピー</button>
                <button class="btn btn-primary" id="downloadTextExport">💾 ダウンロード</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
